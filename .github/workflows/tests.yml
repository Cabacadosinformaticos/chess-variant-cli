name: tests

on:
  push:
  pull_request:

jobs:
  io-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build src/Project.sln -warnaserror
      - name: Run input/output tests
        run: ./run-tests.sh
